name: Bug report
description: Report a reproducible problem with CSHCLI.
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What were you trying to do, and which command or workflow failed?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest numbered steps needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: input
    id: cshcli-version
    attributes:
      label: CSHCLI version or commit
      description: Include the installed version or the source commit you used.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: Python 3.11.x
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Include relevant output with secrets and personal data removed. Never share API keys, coordination tokens, or invitation tokens.
    validations:
      required: false
