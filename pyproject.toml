[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cshcli"
version = "0.2.0"
description = "AI CLI with personal providers and shared project coordination"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [{name = "CSHCLI contributors"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
]

[project.scripts]
cshcli = "cshcli.cli:main"

[project.urls]
Repository = "https://github.com/jtpydk5gyh-alt/cshcli"
Issues = "https://github.com/jtpydk5gyh-alt/cshcli/issues"

# The local pilot and the client stay dependency-free. The remote service needs
# a PostgreSQL driver, and the plan declares it as an extra rather than a
# runtime requirement: installing cshcli must never drag in a database driver
# that the local coordinator does not use.
[project.optional-dependencies]
remote = ["psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]
